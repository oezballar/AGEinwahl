<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einwahl</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<aside class="sidebar">
    <a class="brand" th:href="@{/}">AG-Einwahl</a>
    <nav class="nav">
        <a class="nav-link" th:href="@{/}">Übersicht</a>
        <a class="nav-link" th:href="@{/ags}">AGs</a>
        <a class="nav-link active" th:href="@{/teilnehmer}">Teilnehmer</a>
        <a class="nav-link" th:href="@{/exports}">Exports</a>
    </nav>
</aside>

<main class="page">
    <section class="page-heading">
        <div>
            <h1 th:text="'Einwahl: ' + ${teilnehmer.vorname()} + ' ' + ${teilnehmer.name()}">Einwahl</h1>
            <p th:text="'Klasse ' + ${teilnehmer.klasse()}">Klasse 1a</p>
        </div>
    </section>

    <p class="error" th:if="${fehler}" th:text="${fehler}">Fehler</p>

    <form method="post" th:action="@{/teilnehmer/{id}/einwahl(id=${teilnehmer.id()})}">
        <section class="selection-layout">
            <section class="selection-panel" th:each="tag : ${einwahlTage}">
                <h2 th:text="${tag.wochentag()}">MONTAG</h2>
                <div class="selection-time-group" th:each="zeitgruppe : ${tag.zeitgruppen()}">
                    <h3 th:text="${zeitgruppe.zeit()}">NACHMITTAG</h3>
                    <label class="assignment-control" th:if="${zeitgruppe.zuweisungsAuswahl()}">
                        <span>Zugewiesen</span>
                        <select class="compact-select"
                                th:classappend="${zeitgruppe.offen()} ? ' open-selection'"
                                th:attr="data-zuweisungs-typ=${zeitgruppe.jaNeinAuswahl()} ? 'ja-nein' : 'prioritaet'"
                                th:name="${zeitgruppe.zuweisungsFeldname()}">
                            <option value=""
                                    th:selected="${zeitgruppe.zugewieseneEinwahlId() == null}"
                                    th:text="${zeitgruppe.vormittagsAuswahl()} ? 'Keine' : 'Offen'">Offen</option>
                            <option th:each="option : ${zeitgruppe.optionen()}"
                                    th:value="${option.id()}"
                                    th:text="${option.ag().titel()}"
                                    th:selected="${option.id() == zeitgruppe.zugewieseneEinwahlId()}">AG</option>
                        </select>
                    </label>
                    <div class="selection-list">
                        <label class="selection-item" th:each="option : ${zeitgruppe.optionen()}">
                            <span>
                                <strong th:text="${option.ag().titel()}">AG Titel</strong>
                            </span>
                            <select class="compact-select"
                                    th:if="${option.jaNeinAuswahl()}"
                                    th:classappend="${#strings.isEmpty(option.auswahl())} ? ' open-selection'"
                                    data-ja-nein-auswahl
                                    th:name="${option.feldname()}">
                                <option value="" th:selected="${#strings.isEmpty(option.auswahl())}">Offen</option>
                                <option th:each="auswahl : ${auswahlWerte}"
                                        th:value="${auswahl}"
                                        th:text="${auswahl}"
                                        th:selected="${auswahl.name() == option.auswahl()}">JA</option>
                            </select>
                            <select class="compact-select"
                                    th:if="${option.prioritaetsAuswahl()}"
                                    th:classappend="${#strings.isEmpty(option.auswahl())} ? ' open-selection'"
                                    th:attr="data-einwahl-id=${option.id()}"
                                    th:name="${option.feldname()}">
                                <option value="" th:selected="${#strings.isEmpty(option.auswahl())}">Offen</option>
                                <option th:each="prioritaet : ${zeitgruppe.prioritaeten()}"
                                        th:value="${prioritaet}"
                                        th:text="${prioritaet}"
                                        th:selected="${prioritaet.toString() == option.auswahl()}">1</option>
                            </select>
                        </label>
                    </div>
                </div>
            </section>

            <section class="table-section" th:if="${#lists.isEmpty(einwahlTage)}">
                <p class="empty">Fuer diesen Teilnehmer sind keine Einwahloptionen vorhanden.</p>
            </section>
        </section>

        <div class="form-actions sticky-actions">
            <a class="button secondary" th:href="@{/teilnehmer}">Abbrechen</a>
            <button class="button primary" type="submit">Einwahl speichern</button>
        </div>
    </form>
</main>
<script>
    document.querySelectorAll('.selection-time-group').forEach((gruppe) => {
        const zuweisung = gruppe.querySelector('.assignment-control select');
        const prioritaeten = Array.from(gruppe.querySelectorAll('select[data-einwahl-id]'));

        if (!zuweisung || prioritaeten.length === 0) {
            return;
        }

        const aktualisiereZuweisung = (geaendertePrioritaet) => {
            if (geaendertePrioritaet.value === '1') {
                zuweisung.value = geaendertePrioritaet.dataset.einwahlId;
                return;
            }

            if (zuweisung.value !== geaendertePrioritaet.dataset.einwahlId) {
                return;
            }

            const erstePrioritaet = prioritaeten.find((prioritaet) => prioritaet.value === '1');
            zuweisung.value = erstePrioritaet ? erstePrioritaet.dataset.einwahlId : '';
        };

        prioritaeten.forEach((prioritaet) => {
            prioritaet.addEventListener('change', () => aktualisiereZuweisung(prioritaet));
        });
    });

    document.querySelectorAll('select[data-ja-nein-auswahl]').forEach((auswahl) => {
        const gruppe = auswahl.closest('.selection-time-group');
        const zuweisung = gruppe ? gruppe.querySelector('select[data-zuweisungs-typ="ja-nein"]') : null;

        if (!zuweisung) {
            return;
        }

        auswahl.addEventListener('change', () => {
            const einwahlId = auswahl.name.replace(/^(entdecker_|vormittag_)/, '');

            if (auswahl.value === 'JA') {
                zuweisung.value = einwahlId;
                return;
            }

            if (zuweisung.value !== einwahlId) {
                return;
            }

            const ersteJaAuswahl = Array.from(gruppe.querySelectorAll('select[data-ja-nein-auswahl]'))
                    .find((andereAuswahl) => andereAuswahl.value === 'JA');
            zuweisung.value = ersteJaAuswahl
                    ? ersteJaAuswahl.name.replace(/^(entdecker_|vormittag_)/, '')
                    : '';
        });
    });
</script>
</body>
</html>
