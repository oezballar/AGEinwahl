<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titel}">Teilnehmer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<aside class="sidebar">
    <a class="brand" th:href="@{/}">AG-Einwahl</a>
    <nav class="nav">
        <a class="nav-link" th:href="@{/}">Übersicht</a>
        <a class="nav-link" th:href="@{/ags}">AGs</a>
        <a class="nav-link active" th:href="@{/teilnehmer}">Teilnehmer</a>
        <a class="nav-link" th:href="@{/exports}">Exports</a>
    </nav>
</aside>

<main class="page narrow">
    <section class="page-heading">
        <div>
            <h1 th:text="${titel}">Teilnehmer bearbeiten</h1>
            <p>Klasse im Format 1 bis 4, optional mit a bis c.</p>
        </div>
    </section>

    <p class="error" th:if="${fehler}" th:text="${fehler}">Fehler</p>

    <form class="form" method="post" th:action="@{/teilnehmer}" th:object="${teilnehmerForm}">
        <input type="hidden" th:field="*{id}" th:if="${!neu}">

        <label>
            <span>Vorname</span>
            <input type="text" required th:field="*{vorname}">
        </label>

        <label>
            <span>Name</span>
            <input type="text" required th:field="*{name}">
        </label>

        <label>
            <span>Klasse</span>
            <input type="text" maxlength="2" pattern="[1-4][a-c]?" required th:field="*{klasse}">
        </label>

        <label>
            <span>GT-Teilnahme</span>
            <select required th:field="*{gtTeilnahme}">
                <option value="JA">Ja</option>
                <option value="NEIN">Nein</option>
            </select>
        </label>

        <div class="form-actions">
            <a class="button secondary" th:href="@{/teilnehmer}">Abbrechen</a>
            <button class="button primary" type="submit">Speichern</button>
        </div>
    </form>
</main>
</body>
</html>
